# ═══════════════════════════════════════════════════════════════════
# نشر تلقائي للسيرفرات التابعة على Vercel (kappa / dun / seven)
#
# كل تحديث على main → يتبني ويترفع production على السيرفرات الثلاثة.
# (gamma مربوط بـ GitHub Integration من لوحة Vercel بشكل أصلي)
#
# التوكنات مخزنة مشفرة في GitHub Actions Secrets:
#   KAPPA_VERCEL_TOKEN / DUN_VERCEL_TOKEN / SEVEN_VERCEL_TOKEN
# ممكن كمان تشغيل النشر يدويًا من تبويب Actions (Run workflow).
# ═══════════════════════════════════════════════════════════════════
name: Deploy Satellites (kappa / dun / seven)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-satellites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [kappa, dun, seven]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── kappa ──────────────────────────────────────────────
      - name: Deploy kappa → Vercel Production
        if: matrix.site == 'kappa'
        env:
          VERCEL_TOKEN: ${{ secrets.KAPPA_VERCEL_TOKEN }}
          VERCEL_SCOPE: samgany278-gmailcoms-projects
        run: |
          npx -y vercel@latest link --yes --project hotspot-system --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          npx -y vercel@latest deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      # ── dun ────────────────────────────────────────────────
      - name: Deploy dun → Vercel Production
        if: matrix.site == 'dun'
        env:
          VERCEL_TOKEN: ${{ secrets.DUN_VERCEL_TOKEN }}
          VERCEL_SCOPE: bdalhlymzaldyn7-gmailcoms-projects
        run: |
          npx -y vercel@latest link --yes --project hotspot-system --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          npx -y vercel@latest deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      # ── seven ──────────────────────────────────────────────
      - name: Deploy seven → Vercel Production
        if: matrix.site == 'seven'
        env:
          VERCEL_TOKEN: ${{ secrets.SEVEN_VERCEL_TOKEN }}
          VERCEL_SCOPE: zyzwdnjr-gmailcoms-projects
        run: |
          npx -y vercel@latest link --yes --project hotspot-system --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          npx -y vercel@latest deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
